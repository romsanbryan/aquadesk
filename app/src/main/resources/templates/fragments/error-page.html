<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | AquaDesk'">AquaDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/aquadesk-theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<main th:fragment="content(code, pageTitle, description)" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
            <section class="card shadow-sm border-0 text-center">
                <div class="card-body p-4 p-md-5">
                    <div class="display-1 fw-bold text-primary" th:text="${code}">404</div>
                    <div class="display-5 text-primary mb-3" aria-hidden="true">
                        <i class="bi bi-water"></i>
                    </div>
                    <h1 class="h3 mb-3" th:text="${pageTitle}">Página no encontrada</h1>
                    <p class="text-muted mb-4" th:text="${description}">No se ha encontrado la página solicitada.</p>
                    <a class="btn btn-primary" th:href="@{/acuario}">
                        <i class="bi bi-house-door me-1" aria-hidden="true"></i>
                        <span th:text="#{error.page.home}">Volver a acuarios</span>
                    </a>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
