<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="header-scripts">
    <meta charset="UTF-8">

    <title>AquaDesk</title>

    <link rel="icon" th:href="@{/img/icon/favicon-32.png}" type="image/png" sizes="32x32">
    <link rel="shortcut icon" th:href="@{/img/icon/favicon.ico}">
    <link rel="icon" th:href="@{/img/icon/favicon.svg}" type="image/svg+xml">
    <link rel="apple-touch-icon" th:href="@{/img/icon/apple-touch-icon.png}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/aquadesk-theme.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.11/index.global.min.js" defer></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

</head>

<style th:fragment="style">
    body {
        padding-bottom: 75px;
        background-color: #fafafa;
    }


    /* ── Calendar context menu ── */
    #cal-context-menu {
        position: fixed;
        z-index: 9999;
        background: #fff;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
        padding: 4px 0;
        min-width: 180px;
        display: none;
    }

    #cal-context-menu .ctx-item {
        padding: 8px 16px;
        cursor: pointer;
        font-size: .9rem;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #212529;
        transition: background .12s;
    }

    #cal-context-menu .ctx-item:hover {
        background-color: #f0f4ff;
        color: #0d6efd;
    }

    #calendar {
        width: 100%;
        height: calc(100vh - 200px);
        background-color: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }

    .fc-eventTratamiento,
    .fc-daygrid-eventTratamiento,
    .fc-daygrid-block-eventTratamiento {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
    }

    .fc-eventTratamiento:hover,
    .fc-daygrid-eventTratamiento:hover {
        background-color: transparent !important;
    }

    .fc-eventTratamiento-main {
        color: inherit !important;
        padding: 0 !important;
    }

    .fc-daygrid-eventTratamiento-dot {
        display: none !important;
    }

    .fc-daygrid-day-events {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 2px !important;
        align-items: center !important;
    }

    .fc-daygrid-eventTratamiento-harness {
        flex: 0 0 auto !important;
        width: auto !important;
        margin: 0 !important;
    }
</style>

<body>

<nav th:fragment="header" class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#" th:text="#{application}"/>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul>
                <li class="nav-item d-flex align-items-center">
                    <!--                    <div class="dropdown">-->
                    <!--                        <button class="btn btn-outline-success d-flex align-items-center"-->
                    <!--                                type="button"-->
                    <!--                                data-bs-toggle="dropdown"-->
                    <!--                                aria-expanded="false">-->
                    <!--                            <span class="me-2">&#128100;</span>-->
                    <!--                            <span th:text="#{header.user}"/>-->
                    <!--                        </button>-->
                    <!--                        <ul class="dropdown-menu shadow" aria-labelledby="navbarDropdown">-->
                    <!--                            <li><a class="dropdown-item" href="#" th:text="#{header.user.logout}"/></li>-->
                    <!--                        </ul>-->
                    <!--                    </div>-->

                </li>
            </ul>
        </div>
    </div>
</nav>


<div th:fragment="footer" class="fixed-bottom text-white p-3 shadow-lg"
     style="z-index: 9999; background-color: #fabada; border-top: 2px solid #0d6efd;">
    <div class="container">
        <div class="row text-center">
            <div class="col">
                <a th:href="@{/acuario}" class="text-white text-decoration-none">
                    <i class="d-block mb-1">&#128031;</i>
                    <small th:text="#{footer.acuario}"/>
                </a>
            </div>
            <div class="col">
                <div class="dropdown me-2 d-none" id="notif-bell-wrapper">
                    <button class="btn btn-danger position-relative"
                            type="button"
                            id="dropdownMenuButton"
                            data-bs-toggle="dropdown"
                            aria-expanded="false">
                        <span>&#128276;</span>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark"
                              id="notif-bell-badge">0</span>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow" id="notif-bell-list"
                        aria-labelledby="dropdownMenuButton" style="min-width: 220px;">
                    </ul>
                </div>
            </div>
            <div class="col" th:if="${aquariumId != null}">
                <button type="button" class="btn btn-link text-white text-decoration-none p-0"
                        data-bs-toggle="modal" data-bs-target="#history-export-modal">
                    <i class="bi bi-download d-block mb-1" aria-hidden="true"></i>
                    <small th:text="#{footer.history}"/>
                </button>
            </div>
        </div>
    </div>
</div>
