spring.application.name=aquadesk
server.port=8087
# HikariCP keeps database connections available for reuse.
spring.datasource.hikari.pool-name=AquaDeskPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Telegram configuration
telegram.bot-token=
telegram.chat-id=
spring.messages.basename=i18n/aquadesk
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=${AQUADESK_LOCALE:es}
spring.web.locale-resolver=fixed
# Set AQUADESK_LOG_LEVEL=DEBUG to enable detailed application logs.
logging.level.root=INFO
logging.level.romsanbryan.aquadesk=${AQUADESK_LOG_LEVEL:INFO}
logging.level.romsanbryan.notifications=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n
